name: node-red

services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "1880:1880"
    volumes:
      - node_red_data:/data
    environment:
      - TZ=Asia/Ho_Chi_Minh
      # Discord alerts from the "2. Luồng khẩn cấp" flow; set it in node-red/.env
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      # Báo Hermes Agent khi có cảnh báo (node "Báo Hermes Agent"); trùng WEBHOOK_SECRET của Hermes
      - HERMES_WEBHOOK_SECRET=${HERMES_WEBHOOK_SECRET:-}

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "8123:8123"
    volumes:
      - ./homeassistant/config:/config
    environment:
      - TZ=Asia/Ho_Chi_Minh

  # MCP server: AI đọc và điều khiển trạm gas qua Home Assistant (ai-agent/airgas_mcp.py).
  # Bot dùng nó qua mạng Docker. Cổng 8001 chỉ mở trên máy này để thử bằng tay.
  airgas-mcp:
    build:
      context: ../ai-agent
      dockerfile: Dockerfile.mcp
    image: airgas-mcp:latest
    container_name: airgas-mcp
    restart: unless-stopped
    depends_on:
      - homeassistant
    env_file: ../ai-agent/.env
    environment:
      - HA_URL=http://homeassistant:8123
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:8001:8000"

  # Bot Discord hỏi đáp, dùng LLM tương thích OpenAI và MCP server ở trên (ai-agent/discord_bot.py).
  airgas-bot:
    build:
      context: ../ai-agent
      dockerfile: Dockerfile.bot
    image: airgas-bot:latest
    container_name: airgas-bot
    restart: unless-stopped
    depends_on:
      - airgas-mcp
    env_file: ../ai-agent/.env
    environment:
      - MCP_URL=http://airgas-mcp:8000/mcp
      - TZ=Asia/Ho_Chi_Minh

volumes:
  node_red_data:
  mosquitto_data:
  mosquitto_log:
